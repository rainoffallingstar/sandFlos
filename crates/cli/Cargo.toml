[package]
name = "booxctl"
version = "0.1.0"
edition = "2021"
description = "booxctl: command-line client for sending documents to BOOX devices"
license = "UNLICENSED"

[[bin]]
name = "booxctl"
path = "src/main.rs"

[dependencies]
boox-core = { path = "../core" }
qrcodegen = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

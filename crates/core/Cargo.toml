[package]
name = "boox-core"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5.0"
hmac = "0.12"
http-body = "1"
httpdate = "1.0"
keyring = { version = "3", features = ["apple-native"] }
mime_guess = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
qrcodegen = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
url = "2.5"
urlencoding = "2.1"
uuid = { version = "1.10", features = ["v4"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

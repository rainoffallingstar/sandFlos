[package]
name = "send2boox-desktop-gpui"
version = "0.1.0"
edition = "2021"

[dependencies]
auto-launch = "0.5"
boox-core = { path = "../core" }
gpui = { version = "0.2.2", default-features = false, features = ["runtime_shaders"] }
gpui-component = "0.5.1"
rfd = "0.15"
tray-icon = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5.3"
[dev-dependencies]
resvg = "0.45"

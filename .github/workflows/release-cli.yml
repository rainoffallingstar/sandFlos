name: CLI release
on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'CLI tag to validate and package (manual runs never create a release)'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: cli-release-${{ github.event_name }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CLI_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Require tag to match the CLI manifest
        shell: bash
        run: python3 scripts/release_cli.py check-tag --tag "$CLI_TAG"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Test, lint, build and verify native CLI
        shell: bash
        run: bash scripts/check_cli.sh
      - name: Archive and verify the release download
        shell: bash
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')"
          python3 scripts/release_cli.py archive --tag "$CLI_TAG" --target "$target" \
            --package target/cli-package --output-dir release-assets
          for archive in release-assets/*.zip; do
            python3 scripts/verify_cli_package.py "$archive"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sandflos-cli-release-${{ matrix.os }}
          path: release-assets/*
          if-no-files-found: error
  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cli-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sandflos-cli-release-*
          merge-multiple: true
          path: release-assets
      - name: Create a draft with the three verified native packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CLI_TAG: ${{ github.ref_name }}
        run: |
          test "$(find release-assets -name '*.zip' -type f | wc -l)" -eq 3
          gh release create "$CLI_TAG" release-assets/* --verify-tag --draft \
            --title "sandflos $CLI_TAG" --generate-notes --latest=false

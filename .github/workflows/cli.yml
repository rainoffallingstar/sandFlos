name: CLI
on:
  push:
    branches: [cli]
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.*'
      - 'scripts/**'
      - '.github/workflows/cli.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test, lint and build CLI
        shell: bash
        run: bash scripts/check_cli.sh
      - name: Package standalone binary
        shell: bash
        run: python3 scripts/package_cli.py
      - uses: actions/upload-artifact@v4
        with:
          name: sandflos-${{ matrix.os }}
          path: cli-package/
          if-no-files-found: error
  verify-package:
    needs: cli
    env:
      PACKAGE_ZIP: sandflos-artifact.zip
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Download published artifact ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: sandflos-${{ matrix.os }}
        run: |
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\") | .id")"
          test -n "$artifact_id"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$PACKAGE_ZIP"
      - name: Verify downloaded package and run binary
        shell: bash
        run: python3 scripts/verify_cli_package.py "$PACKAGE_ZIP"
  desktop-compatibility:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p send2boox-desktop-gpui

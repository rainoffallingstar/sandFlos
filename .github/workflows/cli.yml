name: CLI
on:
  push:
    branches: [cli]
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'scripts/**'
      - '.github/workflows/cli.yml'
      - '.github/workflows/release-cli.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test, lint and build CLI
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check_cli.sh 2>&1 | tee cli-check.log
      - name: Report CLI failure in check annotations
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('cli-check.log')
          if path.exists():
              tail = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', path.read_text(encoding='utf-8', errors='replace'))[-16000:]
              for offset in range(0, len(tail), 3000):
                  message = tail[offset:offset + 3000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title=CLI check failed part {offset // 3000 + 1}::{message}')
      - name: Package standalone binary
        shell: bash
        run: python3 scripts/package_cli.py
      - name: Validate the native versioned release archive
        shell: bash
        run: |
          cli_version="$(python3 -c 'import tomllib; print(tomllib.load(open("crates/cli/Cargo.toml", "rb"))["package"]["version"])')"
          native_target="$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')"
          python3 scripts/release_cli.py archive --tag "cli-v${cli_version}" \
            --target "$native_target" --package target/cli-package --output-dir release-assets
          for archive in release-assets/*.zip; do
            python3 scripts/verify_cli_package.py "$archive"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sandflos-${{ matrix.os }}
          path: cli-package/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sandflos-release-archive-${{ matrix.os }}
          path: release-assets/*
          if-no-files-found: error
  verify-package:
    needs: cli
    env:
      PACKAGE_ZIP: sandflos-artifact.zip
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Download published artifact ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: sandflos-${{ matrix.os }}
        run: |
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\") | .id")"
          test -n "$artifact_id"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$PACKAGE_ZIP"
      - name: Verify downloaded package and run binary
        shell: bash
        run: python3 scripts/verify_cli_package.py "$PACKAGE_ZIP"
  desktop-compatibility:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p send2boox-desktop-gpui
